<title>Ruleta de Premios LTH</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800;1,900&family=Barlow:wght@500;700&display=swap">
<style>
:root{color-scheme:dark;--navy:#07245e;--blue:#0d47b8;--blue2:#1a5fe0;--red:#d8262e;--yel:#f6c511;--white:#fff;--ink:#e8eefc;--muted:#9fb3e0}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:radial-gradient(ellipse at 30% 20%,var(--blue2),var(--navy) 70%);color:var(--ink);font-family:Barlow,system-ui,sans-serif;padding-inline:16px;min-height:100%}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.08;background-image:linear-gradient(30deg,#fff 12%,transparent 12.5%,transparent 87%,#fff 87.5%),linear-gradient(150deg,#fff 12%,transparent 12.5%,transparent 87%,#fff 87.5%);background-size:40px 70px}
.wrap{max-width:1180px;margin:0 auto;padding-block:24px 40px;position:relative}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-family:"Barlow Condensed",sans-serif;font-style:italic;font-weight:900;font-size:2.6rem;letter-spacing:.02em;color:#fff;background:var(--blue);padding:2px 18px;border-radius:6px;transform:skewX(-8deg);box-shadow:0 0 0 3px #fff}
.brand{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.gl{margin:0;font-family:"Barlow Condensed",Arial,sans-serif;font-style:italic;font-weight:900;font-size:clamp(1.8rem,4.5vw,3rem);text-transform:uppercase;letter-spacing:.02em;line-height:1;color:#fff;text-shadow:0 3px 0 #8c1219}
.gl span{color:var(--yel)}
.store{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:.9rem}
select{background:var(--navy);color:#fff;border:1px solid var(--muted);border-radius:6px;padding:6px 10px;font:inherit}
main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:40px;align-items:center;margin-top:24px}
@media(max-width:860px){main{grid-template-columns:1fr}}
.wheelbox{position:relative;width:100%;max-width:560px;aspect-ratio:1;margin:0 auto}
canvas{width:100%;height:100%;display:block;filter:drop-shadow(0 18px 30px rgba(0,0,0,.45))}
.pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:22px solid transparent;border-right:22px solid transparent;border-top:44px solid #fff;filter:drop-shadow(0 3px 3px rgba(0,0,0,.4));z-index:2}
.hub{position:absolute;inset:0;margin:auto;width:22%;height:22%;border-radius:50%;background:#fff;border:6px solid var(--navy);display:grid;place-items:center;cursor:pointer;font-family:"Barlow Condensed",Arial,sans-serif;font-style:italic;font-weight:900;font-size:clamp(1rem,3vw,1.7rem);color:var(--red);box-shadow:0 4px 14px rgba(0,0,0,.4)}
.hub:hover{transform:scale(1.04)}.hub:focus-visible{outline:4px solid var(--yel)}
.hub[disabled]{cursor:default;opacity:.85}
h2{font-family:"Barlow Condensed",Arial,sans-serif;font-style:italic;font-weight:900;font-size:2.4rem;margin:0 0 4px;text-transform:uppercase;letter-spacing:.01em}
h2 span{color:var(--yel)}
.sub{color:var(--muted);margin:0 0 18px}
.prizes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.prize{background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.12);border-radius:12px;padding:12px;display:flex;gap:12px;align-items:center;transition:.3s}
.prize.win{border-color:var(--yel);background:rgba(246,197,17,.18);transform:scale(1.04)}
.ph{flex:0 0 72px;height:72px;border-radius:10px;display:grid;place-items:center;overflow:hidden;background:#fff}
.ph img{width:100%;height:100%;object-fit:contain}
.prize b{display:block;font-size:1.05rem;color:#fff}
.prize small{color:var(--muted)}
.cta{margin-top:18px;width:100%;padding:16px;border:0;border-radius:40px;background:var(--red);color:#fff;font-family:"Barlow Condensed",Arial,sans-serif;font-style:italic;font-weight:900;font-size:1.6rem;text-transform:uppercase;cursor:pointer;box-shadow:0 6px 0 #8c1219}
.cta:active{transform:translateY(3px);box-shadow:0 3px 0 #8c1219}.cta[disabled]{opacity:.6}
.modal{position:fixed;inset:0;background:rgba(3,14,40,.8);display:grid;place-items:center;padding:16px;z-index:9}
.card{background:#fff;color:var(--navy);border-radius:18px;padding:28px;max-width:420px;width:100%;text-align:center;border-bottom:8px solid var(--red)}
.card .big{width:200px;height:200px;margin:0 auto 12px;border-radius:14px;overflow:hidden;display:grid;place-items:center;background:#eef3ff}
.card .big img{width:100%;height:100%;object-fit:contain}
.card h3{font-family:"Barlow Condensed",Arial,sans-serif;font-style:italic;font-weight:900;font-size:2.4rem;margin:0;color:var(--red);text-transform:uppercase}
.card p{margin:6px 0 18px;font-weight:700;font-size:1.3rem}
.card button{border:0;background:var(--blue);color:#fff;padding:12px 26px;border-radius:30px;font:700 1rem Barlow;cursor:pointer}
.tk{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 10px}.tk div{background:#eef3ff;border-radius:8px;padding:6px}.tk small{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:#45557a}.tk b{font:900 1.35rem ui-monospace,Menlo,monospace;letter-spacing:.06em}
.tkm{font-size:.9rem;color:#45557a;margin-bottom:8px}.tkh{font-size:.85rem;background:#fff6d6;border-radius:8px;padding:8px;margin-bottom:14px}
.lock{margin-top:14px;padding:12px;border-radius:10px;background:rgba(246,197,17,.14);border:1px dashed var(--yel);font-weight:700}
.log{margin-top:14px;font-size:.85rem;color:var(--muted)}
footer{margin-top:28px;text-align:center;font-family:"Barlow Condensed",Arial,sans-serif;font-style:italic;font-weight:900;font-size:1.5rem;background:var(--red);border-radius:40px;padding:8px;text-transform:uppercase}
@media(prefers-reduced-motion:reduce){.prize{transition:none}}
</style>

<div class="wrap">
  <header>
    <div class="brand"><div class="logo">LTH</div><h1 class="gl">Grupo <span>Llanterama</span></h1></div>
  </header>

  <main>
    <div class="wheelbox">
      <div class="pointer"></div>
      <canvas id="wheel" width="1000" height="1000" aria-label="Ruleta de premios"></canvas>
      <button class="hub" id="hub" aria-label="Girar ruleta">GIRA</button>
    </div>

    <section>
      <h2 id="hola">Premios <span>a ganar</span></h2>
      <p class="sub" id="intro">Gracias por tu compra. Gira la ruleta y descubre tu premio.</p>
      <div class="prizes" id="prizes"></div>
      <button class="cta" id="spin">¡Girar la ruleta!</button>
      <div class="log" id="log"></div>
    </section>
  </main>

  <footer>¡Con LTH, siempre ganas!</footer>
</div>

<div class="modal" id="modal" hidden>
  <div class="card">
    <div class="big" id="mImg"></div>
    <h3>¡Ganaste!</h3>
    <p id="mTxt"></p>
    <div class="tk">
      <div><small>Folio</small><b id="tFolio"></b></div>
      <div><small>Código</small><b id="tCode"></b></div>
    </div>
    <div class="tkm" id="tMeta"></div>
    <div class="tkh">📸 Toma captura de esta pantalla y muéstrala en sucursal al recoger tu compra.</div>
    <button id="close">Listo</button>
  </div>
</div>

};
const visual = p => p.img ? `<img src="${p.img}" alt="${p.nombre}">` : ICONOS[p.icono]||"";

const cv=document.getElementById('wheel'),ctx=cv.getContext('2d');
const N=PREMIOS.length,SEG=2*Math.PI/N;let rot=SEG/2,spinning=false;
/* Orden en que aparecen en la rueda (índices de PREMIOS). No cambia los códigos. */
const ORDEN=[0,2,3,4,1,5,6,7];
const svgURI=k=>'data:image/svg+xml;utf8,'+encodeURIComponent(ICONOS[k].replace('<svg','<svg xmlns="http://www.w3.org/2000/svg"'));
const iconImgs=PREMIOS.map(p=>{const i=new Image();i.src=p.iconoRueda?svgURI(p.iconoRueda):p.img||('data:image/svg+xml;utf8,'+encodeURIComponent(ICONOS[p.icono].replace('<svg','<svg xmlns="http://www.w3.org/2000/svg"')));i.onload=draw;return i;});

function draw(){
  const c=500,r=480;ctx.clearRect(0,0,1000,1000);
  ctx.save();ctx.translate(c,c);ctx.rotate(rot);
  ORDEN.forEach((i,slot)=>{const p=PREMIOS[i];
    const a=slot*SEG-Math.PI/2-SEG/2;
    ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r,a,a+SEG);ctx.closePath();
    ctx.fillStyle=p.color;ctx.fill();ctx.lineWidth=8;ctx.strokeStyle="#fff";ctx.stroke();
    ctx.save();ctx.rotate(a+SEG/2);
    const dark=p.color==="#f6c511";
    ctx.fillStyle=dark?"#07245e":"#fff";ctx.textAlign="center";
    ctx.translate(r*0.74,0);ctx.rotate(Math.PI/2);
    const L=p.rueda;
    L.forEach((l,k)=>{const big=L.length>1&&k===0&&l.startsWith("$");ctx.font=`italic 900 ${big?60:(l.length>11?30:36)}px 'Barlow Condensed',Arial,sans-serif, Arial`;ctx.fillText(l,0,(L.length>1?(L[0].startsWith("$")?-36:-60):-50)+k*(big?42:38));});
    if(iconImgs[i].complete&&iconImgs[i].naturalWidth){ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(0,106,80,0,7);ctx.fill();ctx.drawImage(iconImgs[i],-72,34,144,144);}
    ctx.restore();
  });
  ctx.restore();
  ctx.beginPath();ctx.arc(c,c,r,0,7);ctx.lineWidth=16;ctx.strokeStyle="#07245e";ctx.stroke();
  for(let k=0;k<N*3;k++){const a=k*2*Math.PI/(N*3);ctx.beginPath();ctx.arc(c+Math.cos(a)*r,c+Math.sin(a)*r,9,0,7);ctx.fillStyle=k%2?"#f6c511":"#fff";ctx.fill();}
}

const list=document.getElementById('prizes');
list.innerHTML=ORDEN.map(i=>{const p=PREMIOS[i];return `<div class="prize" id="p${i}"><div class="ph">${p.iconoRueda?ICONOS[p.iconoRueda]:visual(p)}</div><div><b>${p.lista||p.nombre}</b><small>${p.listaDesc||p.desc}</small></div></div>`;}).join('');

/* ---- Lee el link: #<datos>.<codigo> (lo genera el Generador de links) ---- */
function leerLink(){
  try{const h=decodeURIComponent(location.hash.slice(1));const i=h.lastIndexOf(".");if(i<1)return null;
    const b=h.slice(0,i).replace(/-/g,"+").replace(/_/g,"/");
    const d=JSON.parse(decodeURIComponent(escape(atob(b+"===".slice((b.length+3)%4)))));
    if(typeof d.p!=="number"||!PREMIOS[d.p]||!d.f)return null;return {...d,c:h.slice(i+1)};}catch(e){return null;}
}
const T=leerLink();
const btns=[document.getElementById('spin'),document.getElementById('hub')];
const esc=x=>String(x??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
if(T){
  if(T.n)document.getElementById('hola').innerHTML='¡Hola, <span>'+esc(String(T.n).split(" ")[0])+'</span>!';
}else{
  btns.forEach(b=>b.disabled=true);
  document.getElementById('log').outerHTML='<div class="lock">Este juego se activa con el link personal que te envía tu asesor por WhatsApp al confirmar tu compra.</div>';
}
function spin(){
  if(spinning||!T)return;spinning=true;btns.forEach(b=>b.disabled=true);
  document.querySelectorAll('.prize').forEach(e=>e.classList.remove('win'));
  const w=T.p;const jitter=(Math.random()-.5)*SEG*.6;
  const target=-ORDEN.indexOf(w)*SEG+jitter;const cur=rot%(2*Math.PI);
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const delta=(reduce?0:6)*2*Math.PI+((target-cur)%(2*Math.PI)+2*Math.PI)%(2*Math.PI);
  const start=rot,dur=reduce?300:5500,t0=performance.now();
  (function step(t){const k=Math.min(1,(t-t0)/dur);rot=start+delta*(1-Math.pow(1-k,4));draw();
    if(k<1)requestAnimationFrame(step);else done(w);})(t0);
}
function done(w){
  spinning=false;btns.forEach(b=>b.disabled=false);
  const p=PREMIOS[w];document.getElementById('p'+w).classList.add('win');
  document.getElementById('mImg').innerHTML=visual(p);document.getElementById('mTxt').textContent=p.nombre;
  document.getElementById('tFolio').textContent=T.f;document.getElementById('tCode').textContent=T.c;
  document.getElementById('tMeta').innerHTML=(T.n?esc(T.n)+'<br>':'')+(T.s?'Recoge en sucursal <b>'+esc(T.s)+'</b>':'');
  document.getElementById('modal').hidden=false;
}
btns.forEach(b=>b.addEventListener('click',spin));
document.getElementById('close').onclick=()=>document.getElementById('modal').hidden=true;
draw();document.fonts&&document.fonts.ready.then(draw);
</script>
